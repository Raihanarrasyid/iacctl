version: '3.8'

services:
  # PostgreSQL Database for development
  postgres:
    image: postgres:15-alpine
    container_name: iacctl-postgres-dev
    environment:
      POSTGRES_DB: iacctl_dev
      POSTGRES_USER: iacctl_user
      POSTGRES_PASSWORD: iacctl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - iacctl-dev-network
    restart: unless-stopped

  # Redis for development
  redis:
    image: redis:7-alpine
    container_name: iacctl-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - iacctl-dev-network
    restart: unless-stopped

  # Development database admin tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: iacctl-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@iacctl.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - iacctl-dev-network
    restart: unless-stopped

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: iacctl-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - iacctl-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  iacctl-dev-network:
    driver: bridge
